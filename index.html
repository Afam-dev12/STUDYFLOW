<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>StudyFlow</title>

    <link rel="stylesheet" href="style.css">
    </head>
<body>

    <!-- layout  -->
     <div class=layout>
        <!-- SIDEBAR -->

    <aside>
       <div class="logo">
            <h1>StudyFlow</h1>
            <p>Productivity APP</p>
       </div>

        <div class="menu">

            <a href="#" class="active">
                Dashboard
            </a>

            <a href="#" class="active">
                Tasks
            </a>

            <a href="#">
                Settings
            </a>
            
        </div>

    </aside>

    <!-- MAIN CONTENT-->
     <main>
        <div class="app-container">


            <div class="top-selection">
                <h2>Task Manager</h2>
                <p>stay productive and organized.</p>
            </div>

        <div class="stats">

            <div class="card">
                <h3>0</h3>
                <p>Total Tasks</p>
            </div>    

             <div class="card">
                <h3>0</h3>
                <p>Completed</p>
             </div>

             <div class="card">
                <h3>0</h3>
                <p>Pending</p>
             </div>
        
        </div>     
        
        <div class="task-input">
            <input type="text" id="taskInput" placeholder="Enter a task...">

            <button onclick="addTask()">
                Add Task
            </button>
        </div>

        <div class="filters">

            <button onclick="filterTasks('all')">
                ALL
            </button>

            <button onclick="filterTasks('completed')">
                Completed
            </button>

            <button onclick="filterTasks('pending')">
                Pending
            </button>
            
        </div>

        <ul id="taskList"></ul> 

        </div>
     </main>
    </div>

     <script src="script.js"></script>

</body>
</html>
